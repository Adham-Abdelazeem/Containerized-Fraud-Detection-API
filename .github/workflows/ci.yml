name: CI Pipeline

# 1. When should this assembly line run? Every time we push code to the main branch.
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # 2. What kind of computer should GitHub give us? A fresh Ubuntu Linux server.
    runs-on: ubuntu-latest

    steps:
      # Step 3: Download our code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 4: Install Python on the GitHub server
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Step 5: Install our project's dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx 
          pip install -r requirements.txt

      # Step 6: Run the automated tests we wrote in test_main.py
      - name: Run Pytest
        run: |
          python -m pytest

      # Step 7: Do a test build of the Docker container to ensure the Dockerfile isn't broken
      - name: Build Docker Image
        run: |
          docker build -t fraud-api:latest .